# Example nginx site for the work-English review pages.
# Copy to the server, fill in PORT and ROOT only, then enable the site.
# Do not commit real server IPs, hostnames, or login details to this repository.

# Dedicated unused port. Pick a port that is not already in use
# (do not reuse 80/443 or other existing app ports).
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/work-english-notes;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /data/notes.json {
        add_header Cache-Control "no-store";
    }
}

# Optional: if the server already has a catch-all that returns 404 on port 80
