<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>工作英语复习</title>
  <meta name="description" content="按日期复习工作英语练习：中文原意、最终英文、会议问答和重点纠正。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%239b4a2a'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='white' font-family='serif'%3EEN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="top">
    <div class="brand">
      <p class="eyebrow">日常复习</p>
      <h1>工作英语复习</h1>
    </div>
    <form class="search" role="search" action="#" method="get">
      <label class="sr-only" for="q">搜索练习记录</label>
      <input id="q" type="search" name="q" placeholder="搜索中文、英文、问答或纠正…" autocomplete="off" enterkeyhint="search">
    </form>
    <div class="modes" role="group" aria-label="复习显示">
      <button type="button" data-mode="all" class="is-active">全部显示</button>
      <button type="button" data-mode="hide-en">先看中文</button>
      <button type="button" data-mode="hide-zh">先看英文</button>
    </div>
  </header>
  <div class="layout">
    <aside class="dates" id="dates" aria-label="按日期浏览"></aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <script src="assets/app.js" defer></script>
</body>
</html>
